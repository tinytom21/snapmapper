<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>photo-geotagger</title>
    <!--
      Installable, so a phone can run this with no server: the manifest makes "add to home
      screen" offer a real app window, and the service worker registered in main.tsx keeps the
      files. `viewport-fit` and the theme colour are what stop a standalone window looking
      like a browser tab with the chrome hidden.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
